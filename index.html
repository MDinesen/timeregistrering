<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Timeregistrering</title>
<script src="config.js"></script>
<style>
:root {
  --bg: #f5f5f7;
  --panel: #ffffff;
  --side: #ebebef;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: #e2e2e7;
  --hover: #f2f2f5;
  --accent: #2f6fde;
  --accent-text: #ffffff;
  --accent-soft: #e7eefc;
  --danger: #c93434;
  --danger-soft: #fbeaea;
  --mark: #fff1a8;
  --bar: #2f6fde;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.04);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1d1f;
    --panel: #262628;
    --side: #19191b;
    --text: #f2f2f4;
    --muted: #9b9ba1;
    --line: #3a3a3e;
    --hover: #303033;
    --accent: #5b8ff0;
    --accent-text: #0d1a33;
    --accent-soft: #24324d;
    --danger: #f07070;
    --danger-soft: #3e2525;
    --mark: #6b5a12;
    --bar: #5b8ff0;
    --shadow: 0 0 0 1px rgba(255,255,255,.06);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-columns: 220px 1fr;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
input, textarea, select, [contenteditable] { user-select: text; -webkit-user-select: text; }
.selectable, td, .sub { user-select: text; -webkit-user-select: text; }

/* ---------- Sidebar ---------- */
.side {
  background: var(--side);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 18px 12px 12px;
  height: 100vh; position: sticky; top: 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; font-weight: 600; font-size: 14px; }
.brand .logo { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(160deg,#4f8cf7,#2a4fc7); display: grid; place-items: center; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav button {
  all: unset; display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 7px; cursor: default; color: var(--text);
}
nav button svg { width: 16px; height: 16px; opacity: .75; }
nav button:hover { background: var(--hover); }
nav button.active { background: var(--accent); color: var(--accent-text); }
nav button.active svg { opacity: 1; }
nav .count { margin-left: auto; font-size: 11px; opacity: .7; }

.timer-box { margin-top: 18px; }
.timer-card { background: var(--panel); border-radius: 10px; padding: 12px; box-shadow: var(--shadow); }
.timer-card .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.timer-card .time { font: 600 22px/1.2 ui-monospace, "SF Mono", Menlo, monospace; margin: 4px 0; font-variant-numeric: tabular-nums; }
.timer-card .proj { font-size: 12px; color: var(--muted); margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e5484d; margin-right: 6px; animation: pulse 1.4s infinite; vertical-align: 1px; }
@keyframes pulse { 50% { opacity: .3; } }

.side-foot { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; }
.side-foot button, .side-foot label { all: unset; padding: 5px 10px; border-radius: 6px; color: var(--muted); font-size: 12px; cursor: default; }
.side-foot button:hover, .side-foot label:hover { background: var(--hover); color: var(--text); }
.side-foot input { display: none; }

/* ---------- Main ---------- */
main { min-width: 0; padding: 26px 32px 60px; overflow: auto; height: 100vh; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.page-head .spacer { flex: 1; }

.btn {
  all: unset; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 12px; border-radius: 7px; background: var(--panel); color: var(--text);
  box-shadow: var(--shadow); cursor: default; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { background: var(--danger); color: #fff; box-shadow: none; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn svg { width: 14px; height: 14px; }
.btn.block { display: flex; width: 100%; }

.icon-btn {
  all: unset; width: 26px; height: 26px; display: inline-grid; place-items: center;
  border-radius: 6px; color: var(--muted); cursor: default;
}
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
.icon-btn.go:hover { background: var(--accent-soft); color: var(--accent); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); }

.search {
  display: flex; align-items: center; gap: 8px; background: var(--panel); box-shadow: var(--shadow);
  border-radius: 8px; padding: 0 10px; min-width: 280px;
}
.search svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.search input { all: unset; flex: 1; padding: 7px 0; }

.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.stat { background: var(--panel); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat .lbl { font-size: 12px; color: var(--muted); }
.stat .val { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }

.card { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
.card.archived { opacity: .62; }
.cust-head { display: flex; align-items: center; gap: 16px; padding: 14px 16px; }
.cust-head h2 { margin: 0; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.cust-head .sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
.cust-head .grow { flex: 1; min-width: 0; }
.totals { text-align: right; font-variant-numeric: tabular-nums; }
.totals b { display: block; font-size: 14px; }
.totals span { color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 2px; align-items: center; }
.badge { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; background: var(--hover); color: var(--muted); }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 6px 16px; border-top: 1px solid var(--line); }
td { padding: 8px 16px; border-top: 1px solid var(--line); vertical-align: middle; }
tr.row:hover td { background: var(--hover); }
td.num, th.num { text-align: right; white-space: nowrap; }
td.act { width: 1%; white-space: nowrap; text-align: right; padding: 4px 10px; }
tr.archived td:not(.act) { opacity: .55; }
.empty-row td { color: var(--muted); font-style: italic; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.muted { color: var(--muted); }

.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty h3 { color: var(--text); margin: 0 0 6px; font-size: 16px; }
.empty .btn { margin-top: 14px; }

/* ---------- Entry form ---------- */
.entry-form { display: grid; grid-template-columns: minmax(200px, 2fr) 150px 110px minmax(160px, 3fr) auto; gap: 10px; padding: 16px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 7px; padding: 6px 9px; outline: none; width: 100%;
}
.field textarea { resize: vertical; min-height: 60px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field .hint { font-size: 11px; color: var(--muted); }
.field.error input { border-color: var(--danger); }

.period-nav { display: flex; align-items: center; gap: 6px; }
.period-nav .label { min-width: 210px; text-align: center; font-weight: 600; font-size: 14px; }
.period-nav .label small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }

.seg { display: inline-flex; background: var(--panel); box-shadow: var(--shadow); border-radius: 8px; padding: 2px; }
.seg button { all: unset; padding: 5px 14px; border-radius: 6px; cursor: default; font-weight: 500; }
.seg button.on { background: var(--accent); color: var(--accent-text); }

.day-head td { background: var(--bg); font-weight: 600; font-size: 12px; padding: 7px 16px; }
.day-head td.num { color: var(--muted); font-weight: 500; }
.proj-cell b { font-weight: 550; }
.proj-cell .sub { color: var(--muted); font-size: 12px; }
.note { color: var(--muted); }

/* ---------- Report ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.toolbar select { font: inherit; color: var(--text); background: var(--panel); border: none; box-shadow: var(--shadow); border-radius: 7px; padding: 6px 9px; }
.chart-card { padding: 16px 16px 10px; }
.chart-card h3, .card > h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
.card > h3 { padding: 14px 16px 4px; margin: 0; }
.chart-card > h3 { padding: 0 0 10px; }
.chart { display: flex; align-items: flex-end; gap: 4px; height: 150px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; position: relative; }
.chart .bar { width: 100%; max-width: 46px; background: var(--bar); border-radius: 3px 3px 0 0; min-height: 0; }
.chart .bar.zero { background: transparent; }
.chart .v { font-size: 10.5px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chart-labels { display: flex; gap: 4px; margin-top: 5px; }
.chart-labels div { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); min-width: 0; overflow: hidden; }
.cust-row td { background: var(--bg); font-weight: 600; }
.share { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--hover); vertical-align: middle; margin-right: 8px; overflow: hidden; }
.share i { display: block; height: 100%; background: var(--bar); }
.total-row td { font-weight: 700; border-top: 2px solid var(--line); }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.28); display: grid; place-items: center; z-index: 50; animation: fade .12s; }
.modal { background: var(--panel); border-radius: 12px; width: min(460px, calc(100vw - 40px)); box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: pop .14s; }
.modal h2 { margin: 0; padding: 18px 20px 4px; font-size: 16px; }
.modal .body { padding: 12px 20px; display: flex; flex-direction: column; gap: 12px; }
.modal .body p { margin: 0; color: var(--muted); }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.97); opacity: 0; } }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1d1d1f; color: #fff; padding: 9px 16px; border-radius: 9px; opacity: 0; transition: .2s; pointer-events: none; z-index: 60; font-weight: 500; }
.toast.show { opacity: 1; transform: translateX(-50%); }

/* ---------- Sync ---------- */
.sync-box { margin: auto 0 6px; padding-top: 12px; }
.sync-pill {
  all: unset; display: flex; align-items: center; gap: 7px; width: 100%; box-sizing: border-box;
  padding: 6px 10px; border-radius: 7px; font-size: 12px; color: var(--muted); cursor: default;
}
.sync-pill:hover { background: var(--hover); color: var(--text); }
.sync-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); }
.sync-pill .dot.ok { background: #2fa463; }
.sync-pill .dot.busy { background: var(--accent); animation: pulse 1s infinite; }
.sync-pill .dot.warn { background: #e0a100; }
.sync-pill .dot.err { background: var(--danger); }
.sync-pill .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.login-screen { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; place-items: center; padding: 24px; }
.login-card { width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }
.login-card .logo-big { width: 72px; height: 72px; border-radius: 17px; background: linear-gradient(160deg,#4f8cf7,#2a4fc7); display: grid; place-items: center; margin: 0 auto 4px; }
.login-card h1 { text-align: center; margin: 0; font-size: 22px; }
.login-card p { text-align: center; margin: 0 0 6px; color: var(--muted); }
.login-card .err { color: var(--danger); text-align: center; min-height: 1em; font-size: 12px; }
.login-card .btn { padding: 10px; }

.m-only { display: none; }

/* ---------- Mobil ---------- */
@media (max-width: 760px) {
  body { display: block; font-size: 15px; }
  .field input, .field select, .field textarea, .search input, .toolbar select { font-size: 16px; }
  .side {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 30;
    flex-direction: row; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    border-right: none; border-top: 1px solid var(--line);
    background: var(--side);
  }
  .brand, .side-foot { display: none; }
  nav { flex-direction: row; flex: 1; justify-content: space-around; }
  nav button { flex-direction: column; gap: 2px; font-size: 10.5px; padding: 4px 8px; flex: 1; align-items: center; }
  nav button svg { width: 22px; height: 22px; }
  nav button.active { background: none; color: var(--accent); }
  nav .count { display: none; }
  .timer-box { position: fixed; left: 12px; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom)); margin: 0; z-index: 29; }
  .timer-card { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .timer-card .time { font-size: 20px; margin: 0; }
  .timer-card .proj { margin: 0; grid-column: 1; }
  .timer-card .btn { grid-column: 2; grid-row: 1 / span 3; width: auto; }
  .sync-box { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; margin: 0; padding: 0; z-index: 25; }
  .sync-pill { width: auto; background: var(--panel); box-shadow: var(--shadow); padding: 5px 10px; max-width: 46vw; }
  main { height: auto; overflow: visible; padding: calc(14px + env(safe-area-inset-top)) 14px calc(170px + env(safe-area-inset-bottom)); }
  .page-head { gap: 10px; }
  .page-head h1 { font-size: 26px; width: 100%; padding-right: 110px; }
  .page-head .spacer { display: none; }
  .search { min-width: 0; width: 100%; }
  .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat .val { font-size: 18px; }
  .cust-head { flex-wrap: wrap; gap: 8px 12px; padding: 12px 14px; }
  .cust-head .grow { flex: 1 1 60%; }
  .cust-head .actions { width: 100%; justify-content: flex-end; }
  th, td { padding: 8px 10px; }
  td.act { padding: 4px 6px; }
  .icon-btn { width: 32px; height: 32px; }
  .hide-m { display: none; }
  .m-only { display: block; }
  .entry-form { grid-template-columns: 1fr 1fr; }
  .entry-form > :first-child, .entry-form > :nth-child(4), .entry-form > :last-child { grid-column: 1 / -1; }
  .entry-form .btn.primary { flex: 1; padding: 10px; }
  .period-nav .label { min-width: 0; flex: 1; }
  .period-nav { width: 100%; }
  .page-head > .totals { margin-left: auto; }
  .toolbar { gap: 8px; }
  .toolbar .seg { width: 100%; }
  .toolbar .seg button { flex: 1; text-align: center; }
  .toolbar select { flex: 1; }
  .chart .v { font-size: 9px; }
  .share { display: none; }
  .overlay { place-items: end center; }
  .modal { width: 100%; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  .row2 { grid-template-columns: 1fr; }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
}

.print-head { display: none; }
@media print {
  body { display: block; background: #fff; color: #000; }
  .side, .no-print, .toolbar, .act { display: none !important; }
  main { height: auto; overflow: visible; padding: 0; }
  .card, .stat { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
  .print-head { display: block; margin-bottom: 14px; }
  .print-head h1 { margin: 0; font-size: 20px; }
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand">
    <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    Timeregistrering
  </div>
  <nav id="nav"></nav>
  <div class="timer-box" id="timer-box"></div>
  <div class="sync-box" id="sync-box"></div>
  <div class="side-foot">
    <button data-action="export-json">Eksportér backup (JSON)</button>
    <label>Importér backup…<input type="file" id="import-file" accept=".json,application/json"></label>
  </div>
</aside>
<main id="main"></main>
<div id="login-root"></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ================= Helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const krFmt = new Intl.NumberFormat('da-DK', { style: 'currency', currency: 'DKK', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hFmt = new Intl.NumberFormat('da-DK', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fmtKr = v => krFmt.format(v || 0);
const fmtH = min => hFmt.format((min || 0) / 60) + ' t';
const fmtHM = min => `${Math.floor(min / 60)}:${pad(Math.round(min % 60))}`;

const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7));
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  return { week: Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7), year: y };
}

const dShort = d => d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
const dLong = d => cap(d.toLocaleDateString('da-DK', { weekday: 'long', day: 'numeric', month: 'long' }));

function periodRange(type, anchor) {
  if (type === 'week') {
    const start = startOfWeek(anchor), end = addDays(start, 7), w = isoWeek(start);
    return { start, end, label: `Uge ${w.week}, ${w.year}`, sub: `${dShort(start)} – ${dShort(addDays(end, -1))} ${addDays(end, -1).getFullYear()}`, file: `uge-${w.year}-${pad(w.week)}` };
  }
  if (type === 'month') {
    const start = new Date(anchor.getFullYear(), anchor.getMonth(), 1), end = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1);
    return { start, end, label: cap(start.toLocaleDateString('da-DK', { month: 'long', year: 'numeric' })), sub: `${dShort(start)} – ${dShort(addDays(end, -1))}`, file: `${start.getFullYear()}-${pad(start.getMonth() + 1)}` };
  }
  const start = new Date(anchor.getFullYear(), 0, 1), end = new Date(anchor.getFullYear() + 1, 0, 1);
  return { start, end, label: String(start.getFullYear()), sub: '1. jan – 31. dec', file: `${start.getFullYear()}` };
}
function shiftPeriod(type, anchor, dir) {
  if (type === 'week') return addDays(anchor, 7 * dir);
  if (type === 'month') return new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1);
  return new Date(anchor.getFullYear() + dir, 0, 1);
}

function parseDuration(s) {
  s = String(s || '').trim().toLowerCase().replace(/\s+/g, '');
  let m;
  if (!s) return NaN;
  if ((m = s.match(/^(\d+):(\d{1,2})$/))) return +m[1] * 60 + +m[2];
  if ((m = s.match(/^(\d+)t(\d+)m?$/))) return +m[1] * 60 + +m[2];
  if ((m = s.match(/^(\d+)m(in)?$/))) return +m[1];
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)t?$/))) return Math.round(parseFloat(m[1].replace(',', '.')) * 60);
  return NaN;
}
function parseMoney(s) {
  s = String(s || '').trim().replace(/\s|kr\.?/gi, '');
  if (!s) return 0;
  // "1.250,50" -> 1250.50 ; "650.5" -> 650.5
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const v = parseFloat(s);
  return isNaN(v) ? NaN : v;
}
const moneyInput = v => (v ? String(v).replace('.', ',') : '');

function highlight(text, q) {
  const t = esc(text);
  if (!q) return t;
  const i = String(text).toLowerCase().indexOf(q);
  if (i < 0) return t;
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  return {
    version: 2,
    customers: Array.isArray(d.customers) ? d.customers : [],
    projects: Array.isArray(d.projects) ? d.projects : [],

function loadDb() {

function saveLocal() {

/* Ændringssporing: hver ændret/slettet post markeres som "pending" og sendes ved næste sync */
const LIST = { customer: 'customers', project: 'projects', entry: 'entries' };
function touch(kind, obj) {
  const now = Math.max(Date.now(), (obj.updatedAt || 0) + 1);
  obj.updatedAt = now;
  db.sync.pending[obj.id] = { kind, at: now };
}
function markDeleted(kind, id) { db.sync.pending[id] = { kind, at: Date.now(), deleted: true }; }
function findRec(kind, id) {
  if (kind === 'timer') return db.timer && db.timer.id === id ? db.timer : null;
  return db[LIST[kind]].find(x => x.id === id) || null;
}
function setTimer(t) {
  if (t) { db.timer = { id: 'timer', ...t }; touch('timer', db.timer); }
  else if (db.timer) { db.timer = null; markDeleted('timer', 'timer'); }
}
function markAllPending() {
  for (const k of Object.keys(LIST)) for (const o of db[LIST[k]]) db.sync.pending[o.id] = { kind: k, at: o.updatedAt || 0 };
  if (db.timer) db.sync.pending.timer = { kind: 'timer', at: db.timer.updatedAt || 0 };
}

const CFG = window.TIMEREG_CONFIG || {};
const syncConfigured = () => !!(CFG.supabaseUrl && CFG.supabaseKey);
const sync = { busy: false, error: '', lastOk: 0, timer: null, again: false, online: navigator.onLine };

class AuthError extends Error {}

async function authToken(grant, body) {
  const res = await fetch(`${CFG.supabaseUrl}/auth/v1/token?grant_type=${grant}`, {
    method: 'POST', headers: { apikey: CFG.supabaseKey, 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = j.error_description || j.msg || j.message || `Fejl ${res.status}`;
    throw res.status >= 400 && res.status < 500 ? new AuthError(msg) : new Error(msg);
  }
  db.auth = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + j.expires_in * 1000, user: { id: j.user.id, email: j.user.email } };
  saveLocal();
}
let refreshing = null;
async function ensureToken(force) {
  if (!db.auth) throw new AuthError('Ikke logget ind');
  if (!force && Date.now() < db.auth.expires_at - 120000) return;
  if (!refreshing) refreshing = authToken('refresh_token', { refresh_token: db.auth.refresh_token }).finally(() => { refreshing = null; });
  await refreshing;
}
async function api(path, opts = {}, retried) {
  await ensureToken();
  const res = await fetch(CFG.supabaseUrl + path, {
    ...opts,
    headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + db.auth.access_token, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (res.status === 401 && !retried) { await ensureToken(true); return api(path, opts, true); }
  if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`Server: ${res.status} ${t.slice(0, 160)}`); }
  return res;
}

const stripMeta = o => { const { id, updatedAt, ...rest } = o; return rest; };

async function pushChanges() {
  const snap = Object.entries(db.sync.pending);
  for (let i = 0; i < snap.length; i += 500) {
    const chunk = snap.slice(i, i + 500);
    const rows = chunk.map(([id, p]) => {
      const rec = p.deleted ? null : findRec(p.kind, id);
      return { user_id: db.auth.user.id, id, kind: p.kind, data: rec ? stripMeta(rec) : null, deleted: !rec, updated_at: rec ? (rec.updatedAt || 0) : p.at };
    });
    await api('/rest/v1/records?on_conflict=user_id,id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows) });
    // Fjern kun markeringer der ikke er ændret undervejs
    for (const [id, p] of chunk) if (db.sync.pending[id] === p) delete db.sync.pending[id];
    saveLocal();
  }
}

function applyRemote(r) {
  const p = db.sync.pending[r.id];
  if (p) {
    const local = p.deleted ? null : findRec(p.kind, r.id);
    const localAt = local ? (local.updatedAt || 0) : p.at;
    if (localAt > r.updated_at) return false; // vores version er nyere og bliver sendt
    delete db.sync.pending[r.id];
  }
  if (r.kind === 'timer') {
    db.timer = r.deleted ? null : { ...r.data, id: r.id, updatedAt: r.updated_at };
    return true;
  }
  const list = db[LIST[r.kind]];
  if (!list) return false;
  const i = list.findIndex(x => x.id === r.id);
  if (r.deleted) { if (i >= 0) list.splice(i, 1); return i >= 0; }
  const obj = { ...r.data, id: r.id, updatedAt: r.updated_at };
  if (i >= 0) list[i] = obj; else list.push(obj);
  return true;
}

async function pullChanges() {
  let changed = false;
  // Lille overlap i rev, så samtidige skrivninger ikke springes over (genanvendelse er harmløs)
  let from = Math.max(0, db.sync.lastRev - 20);
  for (;;) {
    const res = await api(`/rest/v1/records?select=id,kind,data,deleted,updated_at,rev&rev=gt.${from}&order=rev.asc&limit=1000`);
    const rows = await res.json();
    for (const r of rows) if (applyRemote(r)) changed = true;
    if (rows.length) { from = rows[rows.length - 1].rev; db.sync.lastRev = Math.max(db.sync.lastRev, from); }
    lookup = null;
    if (rows.length < 1000) break;
  }
  saveLocal();
  return changed;
}

async function runSync() {
  if (!syncConfigured() || !db.auth) { renderSync(); return; }
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true; sync.error = ''; renderSync();
  try {
    await pushChanges();
    const changed = await pullChanges();
    sync.lastOk = Date.now(); sync.online = true;
    if (changed) safeRender();
  } catch (e) {
    if (e instanceof AuthError) { db.auth = null; saveLocal(); sync.error = 'Log ind igen'; render(); }
    else if (e instanceof TypeError) { sync.online = false; sync.error = ''; } // netværksfejl
    else sync.error = e.message;
  } finally {
    sync.busy = false; renderSync();
    if (sync.again) { sync.again = false; scheduleSync(300); }
  }
}
function scheduleSync(ms = 1200) {
  if (!syncConfigured() || !db.auth) { renderSync(); return; }
  clearTimeout(sync.timer); sync.timer = setTimeout(runSync, ms);
  renderSync();
}

async function login(email, password) {
  await authToken('password', { email, password });
  if (db.sync.userId !== db.auth.user.id) {
    // Ny bruger på denne enhed: send alt lokalt op og hent alt ned
    db.sync = { ...emptySync(), userId: db.auth.user.id };
    markAllPending();
    saveLocal();
  }
  await runSync();
}
async function logout() {
  try { if (db.auth) await fetch(`${CFG.supabaseUrl}/auth/v1/logout`, { method: 'POST', headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + db.auth.access_token } }); } catch (e) {}
  db.auth = null; saveLocal(); render();
}

async function submitLogin(form, errEl, btn) {

function exportFile(filename, content, mime) {

function idx() {
  if (!lookup) lookup = { c: new Map(db.customers.map(c => [c.id, c])), p: new Map(db.projects.map(p => [p.id, p])) };
  return lookup;
}
const customer = id => idx().c.get(id);
const project = id => idx().p.get(id);
const projectsOf = cid => db.projects.filter(p => p.customerId === cid);
const byName = (a, b) => a.name.localeCompare(b.name, 'da');
const projectActive = p => p && !p.archived && customer(p.customerId) && !customer(p.customerId).archived;
const entryAmount = e => { const p = project(e.projectId); return p ? (e.minutes / 60) * (p.rate || 0) : 0; };
function sumEntries(list) {
  let minutes = 0, amount = 0;
  for (const e of list) { minutes += e.minutes; amount += entryAmount(e); }
  return { minutes, amount };
}
const entriesIn = (start, end) => { const a = toISO(start), b = toISO(end); return db.entries.filter(e => e.date >= a && e.date < b); };

          <button class="icon-btn danger" title="Slet projekt" data-action="delete-project" data-id="${p.id}">${icon('trash')}</button>

    }).join('');
    blocks.push(`<section class="card ${c.archived ? 'archived' : ''}">
      <div class="cust-head">
        <div class="grow">
          <h2>${highlight(c.name, q)} ${c.archived ? '<span class="badge">Arkiveret</span>' : ''}</h2>
          ${sub ? `<div class="sub">${sub}</div>` : ''}
        </div>
        <div class="totals"><b>${fmtH(ct.minutes)}</b><span>${fmtKr(ct.amount)}</span></div>
        <div class="actions">
          ${c.archived ? '' : `<button class="btn small" data-action="new-project" data-id="${c.id}">${icon('plus')} Projekt</button>`}
          <button class="icon-btn" title="Rediger kunde" data-action="edit-customer" data-id="${c.id}">${icon('edit')}</button>
          <button class="icon-btn" title="${c.archived ? 'Gendan kunde' : 'Arkivér kunde'}" data-action="toggle-customer" data-id="${c.id}">${icon(c.archived ? 'restore' : 'archive')}</button>
          <button class="icon-btn danger" title="Slet kunde" data-action="delete-customer" data-id="${c.id}">${icon('trash')}</button>
        </div>
      </div>
      <table>
        ${rows ? `<tr><th>Projekt</th><th class="num hide-m">Timeløn</th><th class="num">Timer i alt</th><th class="num hide-m">Beløb i alt</th><th></th></tr>${rows}`
               : `<tr class="empty-row"><td colspan="5">Ingen ${ui.showArchived ? '' : 'aktive '}projekter${c.archived ? '' : ` – <a href="#" data-action="new-project" data-id="${c.id}">opret et projekt</a>`}</td></tr>`}
      </table>
    </section>`);
  }
  list.innerHTML = blocks.length ? blocks.join('')
    : `<div class="card empty"><h3>Ingen resultater</h3>${q ? `Intet matcher “${esc(ui.search)}”.` : 'Alle kunder er arkiveret.'}${!ui.showArchived ? '<br>Prøv at slå “Vis arkiverede” til.' : ''}</div>`;
}

/* ================= Entries ================= */
function projectOptions(selectedId) {
  const groups = [...db.customers].sort(byName).map(c => {
    const ps = projectsOf(c.id).sort(byName).filter(p => projectActive(p) || p.id === selectedId);
    if (!ps.length) return '';
    return `<optgroup label="${esc(c.name)}">${ps.map(p => `<option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>${esc(p.name)}${p.archived ? ' (arkiveret)' : ''}</option>`).join('')}</optgroup>`;
  }).join('');
  return groups;
}

function renderEntries(main) {
  const hasProjects = db.projects.some(projectActive);
  const r = periodRange('week', ui.entryWeek);
  const list = entriesIn(r.start, r.end).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const tot = sumEntries(list);

  const byDay = new Map();
  for (const e of list) { if (!byDay.has(e.date)) byDay.set(e.date, []); byDay.get(e.date).push(e); }
  let rows = '';
  for (const [date, es] of byDay) {
    const s = sumEntries(es);
    rows += `<tr class="day-head"><td>${esc(dLong(fromISO(date)))}</td><td class="hide-m"></td><td class="hide-m"></td><td class="num">${fmtH(s.minutes)}</td><td class="num hide-m">${fmtKr(s.amount)}</td><td class="act"></td></tr>`;
    for (const e of es) rows += entryRow(e);
  }

  if (!ui.lastProject || !projectActive(project(ui.lastProject))) {
    const first = db.projects.filter(projectActive)[0];
    ui.lastProject = first ? first.id : '';
  }

  main.innerHTML = `
    <div class="page-head"><h1>Registreringer</h1></div>
    ${hasProjects ? `
    <form class="card entry-form" id="entry-form" autocomplete="off">
      <label class="field"><span>Projekt</span><select name="projectId" required>${projectOptions(ui.lastProject)}</select></label>
      <label class="field"><span>Dato</span><input type="date" name="date" value="${toISO(today())}" required></label>
      <label class="field"><span>Tid</span><input name="duration" placeholder="1:30 / 1,5" required></label>
      <label class="field"><span>Beskrivelse</span><input name="note" placeholder="Hvad har du lavet?"></label>
      <div style="display:flex;gap:6px">
        <button class="btn primary" type="submit">Registrér</button>
        <button class="btn" type="button" data-action="start-timer-form" title="Start timer på valgt projekt">${icon('play')}</button>
      </div>
    </form>` : `
    <div class="card empty"><h3>Ingen aktive projekter</h3>Opret en kunde og et projekt, før du kan registrere tid.<br><button class="btn primary" data-view="overview">Gå til kunder & projekter</button></div>`}
    <div class="page-head" style="margin-top:22px">
      <div class="period-nav">
        <button class="icon-btn" data-action="week-prev" title="Forrige uge">${icon('left')}</button>
        <div class="label">${esc(r.label)}<small>${esc(r.sub)}</small></div>
        <button class="icon-btn" data-action="week-next" title="Næste uge">${icon('right')}</button>
        <button class="btn small" data-action="week-today">Denne uge</button>
      </div>
      <div class="spacer"></div>
      <div class="totals"><b>${fmtH(tot.minutes)}</b><span>${fmtKr(tot.amount)}</span></div>
    </div>
    <div class="card">
      ${list.length ? `<table><tr><th>Projekt</th><th class="hide-m">Beskrivelse</th><th class="num hide-m">Tid</th><th class="num">Timer</th><th class="num hide-m">Beløb</th><th></th></tr>${rows}</table>`
                    : `<div class="empty">Ingen registreringer i denne uge.</div>`}
    </div>`;
}

function entryRow(e) {
  const p = project(e.projectId), c = p && customer(p.customerId);
  return `<tr class="row">
    <td class="proj-cell"><b>${esc(p ? p.name : '(slettet)')}</b><div class="sub">${esc(c ? c.name : '')}</div>${e.note ? `<div class="sub m-only">${esc(e.note)}</div>` : ''}</td>
    <td class="note hide-m">${esc(e.note || '')}</td>
    <td class="num muted hide-m">${fmtHM(e.minutes)}</td>

      <button class="icon-btn" title="Rediger" data-action="edit-entry" data-id="${e.id}">${icon('edit')}</button>
      <button class="icon-btn danger" title="Slet" data-action="delete-entry" data-id="${e.id}">${icon('trash')}</button>

/* ================= Reports ================= */
function reportData() {
  const r = periodRange(ui.reportType, ui.reportAnchor);
  let list = entriesIn(r.start, r.end);
  if (ui.reportCustomer) list = list.filter(e => { const p = project(e.projectId); return p && p.customerId === ui.reportCustomer; });
  list.sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
  return { r, list };
}

function renderReports(main) {
  const { r, list } = reportData();
  const tot = sumEntries(list);

  // Fordeling over tid
  let buckets = [];
  if (ui.reportType === 'week') {
    for (let i = 0; i < 7; i++) { const d = addDays(r.start, i); buckets.push({ key: toISO(d), label: cap(d.toLocaleDateString('da-DK', { weekday: 'short' }).replace('.', '')) + ' ' + d.getDate() + '.', full: dLong(d) }); }
  } else if (ui.reportType === 'month') {
    for (let d = r.start; d < r.end; d = addDays(d, 1)) buckets.push({ key: toISO(d), label: String(d.getDate()), full: dLong(d) });
  } else {
    for (let m = 0; m < 12; m++) { const d = new Date(r.start.getFullYear(), m, 1); buckets.push({ key: `${d.getFullYear()}-${pad(m + 1)}`, label: d.toLocaleDateString('da-DK', { month: 'short' }).replace('.', ''), full: cap(d.toLocaleDateString('da-DK', { month: 'long', year: 'numeric' })) }); }
  }
  const bmap = new Map(buckets.map(b => [b.key, 0]));
  for (const e of list) { const k = ui.reportType === 'year' ? e.date.slice(0, 7) : e.date; if (bmap.has(k)) bmap.set(k, bmap.get(k) + e.minutes); }
  const max = Math.max(1, ...bmap.values());
  const showVals = buckets.length <= 12;
  const chart = `<div class="chart">${buckets.map(b => { const v = bmap.get(b.key); return `<div class="col" title="${esc(b.full)}: ${fmtH(v)}">${showVals && v ? `<div class="v">${hFmt.format(v / 60)}</div>` : ''}<div class="bar ${v ? '' : 'zero'}" style="height:${(v / max) * 100}%"></div></div>`; }).join('')}</div>
    <div class="chart-labels">${buckets.map((b, i) => `<div>${ui.reportType === 'month' && i % (innerWidth <= 760 ? 5 : 2) ? '' : esc(b.label)}</div>`).join('')}</div>`;

  // Kunde -> projekt
  const groups = new Map();
  for (const e of list) {
    const p = project(e.projectId); if (!p) continue;
    if (!groups.has(p.customerId)) groups.set(p.customerId, new Map());
    const g = groups.get(p.customerId);
    if (!g.has(p.id)) g.set(p.id, []);
    g.get(p.id).push(e);
  }
  let rows = '';
  const custs = [...groups.keys()].map(customer).filter(Boolean).sort(byName);
  for (const c of custs) {
    const g = groups.get(c.id);
    const cs = sumEntries([...g.values()].flat());
    rows += `<tr class="cust-row"><td>${esc(c.name)}${c.archived ? ' <span class="badge">Arkiveret</span>' : ''}</td><td class="hide-m"></td><td class="num">${fmtH(cs.minutes)}</td><td class="num">${fmtKr(cs.amount)}</td><td class="num muted hide-m">${tot.minutes ? Math.round(cs.minutes / tot.minutes * 100) : 0} %</td></tr>`;
    for (const pid of [...g.keys()].sort((a, b) => byName(project(a), project(b)))) {
      const p = project(pid), s = sumEntries(g.get(pid)), share = tot.minutes ? s.minutes / tot.minutes : 0;
      rows += `<tr class="row"><td style="padding-left:28px">${esc(p.name)}${p.archived ? ' <span class="badge">Arkiveret</span>' : ''}</td><td class="num muted hide-m">${fmtKr(p.rate)} / t</td><td class="num">${fmtH(s.minutes)}</td><td class="num">${fmtKr(s.amount)}</td><td class="num hide-m"><span class="share"><i style="width:${share * 100}%"></i></span>${Math.round(share * 100)} %</td></tr>`;
    }
  }

  const details = list.map(e => {
    const p = project(e.projectId), c = p && customer(p.customerId);
    return `<tr class="row"><td>${esc(fromISO(e.date).toLocaleDateString('da-DK'))}</td><td class="hide-m">${esc(c ? c.name : '')}</td><td>${esc(p ? p.name : '')}</td><td class="note hide-m">${esc(e.note || '')}</td><td class="num">${fmtH(e.minutes)}</td><td class="num">${fmtKr(entryAmount(e))}</td></tr>`;
  }).join('');

  const custOpts = [...db.customers].sort(byName).map(c => `<option value="${c.id}" ${ui.reportCustomer === c.id ? 'selected' : ''}>${esc(c.name)}${c.archived ? ' (arkiveret)' : ''}</option>`).join('');
  const selCust = ui.reportCustomer && customer(ui.reportCustomer);
  const rate = tot.minutes ? tot.amount / (tot.minutes / 60) : 0;

  main.innerHTML = `
    <div class="print-head"><h1>Timerapport – ${esc(r.label)}</h1><div>${esc(r.sub)}${selCust ? ' · ' + esc(selCust.name) : ' · Alle kunder'}</div></div>
    <div class="page-head no-print"><h1>Rapporter</h1></div>
    <div class="toolbar">
      <div class="seg">
        <button data-action="report-type" data-type="week" class="${ui.reportType === 'week' ? 'on' : ''}">Uge</button>
        <button data-action="report-type" data-type="month" class="${ui.reportType === 'month' ? 'on' : ''}">Måned</button>
        <button data-action="report-type" data-type="year" class="${ui.reportType === 'year' ? 'on' : ''}">År</button>
      </div>
      <div class="period-nav">
        <button class="icon-btn" data-action="report-prev" title="Forrige">${icon('left')}</button>
        <div class="label">${esc(r.label)}<small>${esc(r.sub)}</small></div>
        <button class="icon-btn" data-action="report-next" title="Næste">${icon('right')}</button>
        <button class="btn small" data-action="report-today">I dag</button>
      </div>
      <select id="report-customer"><option value="">Alle kunder</option>${custOpts}</select>
      <div class="spacer" style="flex:1"></div>
      <button class="btn" data-action="export-csv" ${list.length ? '' : 'disabled'}>${icon('download')} CSV</button>
      <button class="btn" data-action="print">${icon('print')} Udskriv / PDF</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="lbl">Timer i alt</div><div class="val">${fmtH(tot.minutes)}</div></div>
      <div class="stat"><div class="lbl">Beløb i alt</div><div class="val">${fmtKr(tot.amount)}</div></div>
      <div class="stat"><div class="lbl">Gns. timepris</div><div class="val">${fmtKr(rate)}</div></div>
      <div class="stat"><div class="lbl">Registreringer</div><div class="val">${list.length}</div></div>
    </div>
    ${list.length ? `
    <div class="card chart-card"><h3>Timer pr. ${ui.reportType === 'year' ? 'måned' : 'dag'}</h3>${chart}</div>
    <div class="card"><h3>Fordeling på kunder og projekter</h3>
      <table><tr><th>Kunde / projekt</th><th class="num hide-m">Timeløn</th><th class="num">Timer</th><th class="num">Beløb</th><th class="num hide-m">Andel</th></tr>${rows}
      <tr class="total-row"><td>I alt</td><td class="hide-m"></td><td class="num">${fmtH(tot.minutes)}</td><td class="num">${fmtKr(tot.amount)}</td><td class="hide-m"></td></tr></table>
    </div>
    <div class="card"><h3 style="display:flex;align-items:center">Alle registreringer <span class="spacer" style="flex:1"></span><button class="btn small no-print" data-action="toggle-details">${ui.reportDetails ? 'Skjul' : 'Vis'}</button></h3>
      ${ui.reportDetails ? `<table><tr><th>Dato</th><th class="hide-m">Kunde</th><th>Projekt</th><th class="hide-m">Beskrivelse</th><th class="num">Timer</th><th class="num">Beløb</th></tr>${details}</table>` : '<div style="height:10px"></div>'}
    </div>` : `<div class="card empty"><h3>Ingen registreringer</h3>Der er ingen registreret tid i perioden${selCust ? ' for ' + esc(selCust.name) : ''}.</div>`}`;
}

function exportCSV() {
  const { r, list } = reportData();
  const num = v => v.toFixed(2).replace('.', ',');
  const cell = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const lines = [['Dato', 'Kunde', 'Projekt', 'Beskrivelse', 'Timer', 'Timeløn', 'Beløb'].join(';')];
  for (const e of list) {
    const p = project(e.projectId), c = p && customer(p.customerId);
    lines.push([fromISO(e.date).toLocaleDateString('da-DK'), c ? c.name : '', p ? p.name : '', e.note || '', num(e.minutes / 60), num(p ? p.rate || 0 : 0), num(entryAmount(e))].map(cell).join(';'));
  }
  const t = sumEntries(list);
  lines.push(['I alt', '', '', '', num(t.minutes / 60), '', num(t.amount)].join(';'));
  const c = ui.reportCustomer && customer(ui.reportCustomer);
  const slug = c ? '-' + c.name.toLowerCase().replace(/[^a-z0-9æøå]+/gi, '-').replace(/^-|-$/g, '') : '';
  exportFile(`timerapport-${r.file}${slug}.csv`, '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}

/* ================= Timer ================= */
let timerTick = null;
function renderTimer() {
  const box = $('#timer-box');
  clearInterval(timerTick); timerTick = null;
  const t = db.timer;
  const p = t && project(t.projectId);
  if (!t || !p) {
    if (t && !p && db.customers.length) { setTimer(null); save(); }
    box.innerHTML = '';
    return;
  }
  const c = customer(p.customerId);
  box.innerHTML = `<div class="timer-card"><div class="lbl"><span class="pulse"></span>Timer kører</div><div class="time" id="timer-time"></div><div class="proj">${esc(p.name)} · ${esc(c ? c.name : '')}</div><button class="btn primary block" data-action="stop-timer">${icon('stop')} Stop og gem</button></div>`;
  const upd = () => {
    const s = Math.max(0, Math.floor((Date.now() - t.start) / 1000));
    const el = $('#timer-time'); if (el) el.textContent = `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  };
  upd(); timerTick = setInterval(upd, 1000);
}
function startTimer(pid) {
  if (db.timer) { toast('Stop den kørende timer først'); return; }
  setTimer({ projectId: pid, start: Date.now() });
  ui.lastProject = pid;
  save(); render(); toast('Timer startet');
}
function stopTimer() {
  const t = db.timer; if (!t) return;
  const minutes = Math.max(1, Math.round((Date.now() - t.start) / 60000));
  const e = { id: uid(), projectId: t.projectId, date: toISO(new Date(t.start)), minutes, note: '', createdAt: Date.now() };
  db.entries.push(e); touch('entry', e); setTimer(null); save(); render();
  toast(`Registreret ${fmtH(minutes)}`);
  editEntryModal(e.id, true);
}

/* ================= Modals ================= */
let modalKeyHandler = null;
function openModal({ title, body, submit = 'Gem', danger = false, onSubmit, cancel = 'Annullér' }) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay"><form class="modal" autocomplete="off" novalidate>
      <h2>${esc(title)}</h2><div class="body">${body}</div>
      <div class="foot"><button type="button" class="btn" data-close>${esc(cancel)}</button><button type="submit" class="btn ${danger ? 'danger' : 'primary'}">${esc(submit)}</button></div>
    </form></div>`;
  const form = $('form', root);
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', modalKeyHandler); if (renderDeferred) { renderDeferred = false; setTimeout(safeRender, 0); } };
  form.addEventListener('submit', ev => { ev.preventDefault(); if (onSubmit(form, close) !== false) close(); });
  $('[data-close]', root).onclick = close;
  $('.overlay', root).addEventListener('mousedown', ev => { if (ev.target.classList.contains('overlay')) close(); });
  modalKeyHandler = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', modalKeyHandler);
  setTimeout(() => { const f = $('input:not([type=hidden]), select, textarea', form) || $('[type=submit]', form); f && f.focus(); f && f.select && f.select(); }, 20);
  return close;
}
function confirmDialog(title, message, submit = 'Slet') {
  return new Promise(res => {
    let ok = false;
    openModal({ title, body: `<p>${message}</p>`, submit, danger: true, onSubmit: () => { ok = true; } });
    const obs = new MutationObserver(() => { if (!$('#modal-root').children.length) { obs.disconnect(); res(ok); } });
    obs.observe($('#modal-root'), { childList: true });
  });
}
function fieldError(form, name, msg) {
  const inp = form.elements[name], wrap = inp.closest('.field');
  wrap.classList.add('error');
  let h = $('.hint', wrap); if (!h) { h = document.createElement('div'); h.className = 'hint'; wrap.appendChild(h); }
  h.textContent = msg; h.style.color = 'var(--danger)';
  inp.focus();
  return false;
}

function customerModal(id) {
  const c = id ? customer(id) : {};
  openModal({
    title: id ? 'Rediger kunde' : 'Ny kunde',
    submit: id ? 'Gem' : 'Opret kunde',
    body: `
      <label class="field"><span>Kundenavn *</span><input name="name" value="${esc(c.name)}" placeholder="Fx Firma ApS"></label>
      <div class="row2">
        <label class="field"><span>Kontaktperson</span><input name="contact" value="${esc(c.contact)}"></label>
        <label class="field"><span>Telefon</span><input name="phone" value="${esc(c.phone)}"></label>
      </div>
      <label class="field"><span>E-mail</span><input name="email" type="email" value="${esc(c.email)}"></label>`,
    onSubmit(form) {
      const f = Object.fromEntries(new FormData(form));
      const name = f.name.trim();
      if (!name) return fieldError(form, 'name', 'Skriv et navn');
      const data = { name, contact: f.contact.trim(), phone: f.phone.trim(), email: f.email.trim() };
      if (id) { Object.assign(c, data); touch('customer', c); }
      else { const nc = { id: uid(), archived: false, createdAt: Date.now(), ...data }; db.customers.push(nc); touch('customer', nc); lookup = null; setTimeout(() => projectModal(null, nc.id, true), 50); }
      save(); render(); toast(id ? 'Kunde gemt' : 'Kunde oprettet');
    },
  });
}

function projectModal(id, customerId, afterNewCustomer) {
  const p = id ? project(id) : { customerId };
  const opts = [...db.customers].sort(byName).filter(c => !c.archived || c.id === p.customerId)
    .map(c => `<option value="${c.id}" ${c.id === p.customerId ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  openModal({
    title: id ? 'Rediger projekt' : afterNewCustomer ? 'Opret første projekt' : 'Nyt projekt',
    submit: id ? 'Gem' : 'Opret projekt',
    cancel: afterNewCustomer ? 'Spring over' : 'Annullér',
    body: `
      <label class="field"><span>Projektnavn *</span><input name="name" value="${esc(p.name)}" placeholder="Fx Ny hjemmeside"></label>
      <div class="row2">
        <label class="field"><span>Kunde</span><select name="customerId">${opts}</select></label>
        <label class="field"><span>Timeløn (kr. pr. time)</span><input name="rate" inputmode="decimal" value="${esc(moneyInput(p.rate))}" placeholder="0,00"></label>
      </div>
      <label class="field"><span>Note</span><input name="notes" value="${esc(p.notes)}" placeholder="Valgfri"></label>
      ${id && db.entries.some(e => e.projectId === id) ? '<p style="font-size:12px">Ændres timelønnen, beregnes alle registreringer på projektet med den nye sats.</p>' : ''}`,
    onSubmit(form) {
      const f = Object.fromEntries(new FormData(form));
      const name = f.name.trim();
      if (!name) return fieldError(form, 'name', 'Skriv et navn');
      const rate = parseMoney(f.rate);
      if (isNaN(rate) || rate < 0) return fieldError(form, 'rate', 'Ugyldigt beløb');
      const data = { name, customerId: f.customerId, rate, notes: f.notes.trim() };
      if (id) { Object.assign(p, data); touch('project', p); }
      else { const np = { id: uid(), archived: false, createdAt: Date.now(), ...data }; db.projects.push(np); touch('project', np); ui.lastProject = np.id; }
      save(); render(); toast(id ? 'Projekt gemt' : 'Projekt oprettet');
    },
  });
}

function editEntryModal(id, fromTimer) {
  const isNew = !id;
  const e = id ? db.entries.find(x => x.id === id) : { projectId: ui.lastProject, date: toISO(today()), minutes: 0 };
  if (!e) return;
  openModal({
    title: fromTimer ? 'Tid registreret' : isNew ? 'Registrér tid' : 'Rediger registrering',
    submit: isNew ? 'Registrér' : 'Gem',
    cancel: fromTimer ? 'Luk' : 'Annullér',
    body: `
      <label class="field"><span>Projekt</span><select name="projectId">${projectOptions(e.projectId)}</select></label>
      <div class="row2">
        <label class="field"><span>Dato</span><input type="date" name="date" value="${esc(e.date)}"></label>
        <label class="field"><span>Tid (t:mm eller decimal)</span><input name="duration" value="${e.minutes ? fmtHM(e.minutes) : ''}" placeholder="1:30"></label>
      </div>
      <label class="field"><span>Beskrivelse</span><input name="note" value="${esc(e.note)}" placeholder="Hvad har du lavet?"></label>`,
    onSubmit(form) {
      const f = Object.fromEntries(new FormData(form));
      const minutes = parseDuration(f.duration);
      if (!(minutes > 0)) return fieldError(form, 'duration', 'Skriv fx 1:30, 1,5 eller 45m');
      if (!f.date) return fieldError(form, 'date', 'Vælg en dato');
      const data = { projectId: f.projectId, date: f.date, minutes, note: f.note.trim() };
      if (isNew) { const ne = { id: uid(), createdAt: Date.now(), ...data }; db.entries.push(ne); touch('entry', ne); }
      else { Object.assign(e, data); touch('entry', e); }
      ui.lastProject = f.projectId;
      save(); render(); if (!fromTimer) toast(isNew ? 'Tid registreret' : 'Registrering gemt');
    },
  });
  // Ved timer: fokusér beskrivelsen
  if (fromTimer) setTimeout(() => { const n = $('#modal-root input[name=note]'); n && n.focus(); }, 30);
}

/* ================= Actions ================= */
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const actions = {
  'new-customer': () => customerModal(),
  'edit-customer': d => customerModal(d.id),
  'new-project': d => projectModal(null, d.id),
  'edit-project': d => projectModal(d.id),
  'toggle-customer': d => {
    const c = customer(d.id); c.archived = !c.archived; touch('customer', c);
    if (c.archived && db.timer && project(db.timer.projectId)?.customerId === c.id) stopTimer();
    save(); render(); toast(c.archived ? `${c.name} er arkiveret` : `${c.name} er gendannet`);
  },
  'toggle-project': d => {
    const p = project(d.id); p.archived = !p.archived; touch('project', p);
    if (p.archived && db.timer?.projectId === p.id) stopTimer();
    save(); render(); toast(p.archived ? `${p.name} er arkiveret` : `${p.name} er gendannet`);
  },
  'delete-customer': async d => {
    const c = customer(d.id), ps = projectsOf(c.id), ids = new Set(ps.map(p => p.id));
    const n = db.entries.filter(e => ids.has(e.projectId)).length;
    const extra = ps.length ? ` Det sletter også ${plural(ps.length, 'projekt', 'projekter')} og ${plural(n, 'registrering', 'registreringer')}.` : '';
    if (!(await confirmDialog('Slet kunde?', `Er du sikker på, at du vil slette <b>${esc(c.name)}</b>?${extra} Dette kan ikke fortrydes – overvej at arkivere i stedet.`))) return;
    if (db.timer && ids.has(db.timer.projectId)) setTimer(null);
    for (const e of db.entries) if (ids.has(e.projectId)) markDeleted('entry', e.id);
    for (const p of ps) markDeleted('project', p.id);
    markDeleted('customer', c.id);
    db.entries = db.entries.filter(e => !ids.has(e.projectId));
    db.projects = db.projects.filter(p => p.customerId !== c.id);
    db.customers = db.customers.filter(x => x.id !== c.id);
    if (ui.reportCustomer === c.id) ui.reportCustomer = '';
    save(); render(); toast('Kunde slettet');
  },
  'delete-project': async d => {
    const p = project(d.id), n = db.entries.filter(e => e.projectId === p.id).length;
    if (!(await confirmDialog('Slet projekt?', `Er du sikker på, at du vil slette <b>${esc(p.name)}</b>?${n ? ` Det sletter også ${plural(n, 'registrering', 'registreringer')}.` : ''} Dette kan ikke fortrydes – overvej at arkivere i stedet.`))) return;
    if (db.timer?.projectId === p.id) setTimer(null);
    for (const e of db.entries) if (e.projectId === p.id) markDeleted('entry', e.id);
    markDeleted('project', p.id);
    db.entries = db.entries.filter(e => e.projectId !== p.id);
    db.projects = db.projects.filter(x => x.id !== p.id);
    save(); render(); toast('Projekt slettet');
  },
  'new-entry': d => { ui.lastProject = d.id; editEntryModal(null); },
  'edit-entry': d => editEntryModal(d.id),
  'delete-entry': async d => {
    const e = db.entries.find(x => x.id === d.id);
    if (!(await confirmDialog('Slet registrering?', `${fmtH(e.minutes)} på ${esc(project(e.projectId)?.name || '')} d. ${esc(fromISO(e.date).toLocaleDateString('da-DK'))} slettes.`))) return;
    markDeleted('entry', d.id);
    db.entries = db.entries.filter(x => x.id !== d.id);
    save(); render(); toast('Registrering slettet');
  },
  'start-timer': d => startTimer(d.id),
  'start-timer-form': () => { const s = $('#entry-form select[name=projectId]'); s && s.value && startTimer(s.value); },
  'stop-timer': () => stopTimer(),
  'week-prev': () => { ui.entryWeek = addDays(ui.entryWeek, -7); render(); },
  'week-next': () => { ui.entryWeek = addDays(ui.entryWeek, 7); render(); },
  'week-today': () => { ui.entryWeek = today(); render(); },
  'report-type': d => { ui.reportType = d.type; render(); },
  'report-prev': () => { ui.reportAnchor = shiftPeriod(ui.reportType, ui.reportAnchor, -1); render(); },
  'report-next': () => { ui.reportAnchor = shiftPeriod(ui.reportType, ui.reportAnchor, 1); render(); },
  'report-today': () => { ui.reportAnchor = today(); render(); },
  'toggle-details': () => { ui.reportDetails = !ui.reportDetails; render(); },
  'export-csv': () => exportCSV(),
  'account': () => accountModal(),
  'logout': async () => { $('#modal-root').innerHTML = ''; await logout(); toast('Logget ud'); },
  'print': () => {
    ui.reportDetails = true; render();
    if (bridge) bridge.postMessage({ type: 'print' }); else window.print();
  },
  'export-json': () => exportFile(`timeregistrering-backup-${toISO(today())}.json`, JSON.stringify({ version: 2, customers: db.customers, projects: db.projects, entries: db.entries, timer: db.timer }, null, 1), 'application/json'),
};

document.addEventListener('click', ev => {
  const v = ev.target.closest('[data-view]');
  if (v) { ui.view = v.dataset.view; render(); $('#main').scrollTop = 0; return; }
  const a = ev.target.closest('[data-action]');
  if (a && actions[a.dataset.action]) { ev.preventDefault(); actions[a.dataset.action](a.dataset); }
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'search') { ui.search = ev.target.value; renderOverviewList(); }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'show-archived') { ui.showArchived = ev.target.checked; renderOverviewList(); }
  if (ev.target.id === 'report-customer') { ui.reportCustomer = ev.target.value; render(); }
  if (ev.target.matches('#entry-form select[name=projectId]')) ui.lastProject = ev.target.value;
  if (ev.target.id === 'import-file') importBackup(ev.target);
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'entry-form') return;
  ev.preventDefault();
  const form = ev.target, f = Object.fromEntries(new FormData(form));
  const minutes = parseDuration(f.duration);
  if (!(minutes > 0)) { fieldError(form, 'duration', 'Fx 1:30, 1,5 eller 45m'); return; }
  const ne = { id: uid(), projectId: f.projectId, date: f.date, minutes, note: f.note.trim(), createdAt: Date.now() };
  db.entries.push(ne); touch('entry', ne);
  ui.lastProject = f.projectId;
  ui.entryWeek = fromISO(f.date);
  save(); render(); toast(`Registreret ${fmtH(minutes)}`);
  const d = $('#entry-form input[name=duration]'); d && d.focus();
});

// Cmd+F fokuserer søgning, Cmd+N ny registrering
document.addEventListener('keydown', ev => {
  if (!ev.metaKey || $('#modal-root').children.length) return;
  if (ev.key === 'f') { ev.preventDefault(); if (ui.view !== 'overview') { ui.view = 'overview'; render(); } $('#search').focus(); }
  if (ev.key === 'n' && db.projects.some(projectActive)) { ev.preventDefault(); editEntryModal(null); }
});

function importBackup(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  file.text().then(async txt => {
    let d;
    try { d = JSON.parse(txt); } catch (e) { toast('Filen er ikke gyldig JSON'); return; }
    if (!d || !Array.isArray(d.customers)) { toast('Filen ligner ikke en backup'); return; }
    if (!(await confirmDialog('Importér backup?', `Backuppen indeholder ${plural(d.customers.length, 'kunde', 'kunder')}, ${plural((d.projects || []).length, 'projekt', 'projekter')} og ${plural((d.entries || []).length, 'registrering', 'registreringer')}. Dine nuværende data bliver erstattet.`, 'Erstat data'))) return;
    const keep = { sync: db.sync, auth: db.auth };
    for (const k of Object.keys(LIST)) for (const o of db[LIST[k]]) markDeleted(k, o.id);
    if (db.timer) markDeleted('timer', 'timer');
    const nd = normalize(d);
    db.customers = nd.customers; db.projects = nd.projects; db.entries = nd.entries;
    db.timer = nd.timer ? { ...nd.timer, id: 'timer' } : null;
    db.sync = keep.sync; db.auth = keep.auth;
    markAllPending();
    save(); render(); toast('Backup importeret');
  });
}

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

render();
if (syncConfigured() && db.auth) scheduleSync(100);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
